<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenF1 Overlay</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="overlay">
    <div class="header">
      <div>
        <div class="eyebrow">OpenF1 Live Timing</div>
        <div id="sessionTitle" class="title">Loading...</div>
      </div>
      <div id="statusDot" class="dot"></div>
    </div>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th class="pos">Pos</th>
            <th>Pilote</th>
            <th class="gap">Gap</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div id="emptyState" class="empty hidden">aucune séance en cours</div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
